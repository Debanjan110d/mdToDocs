<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Document Base -->
  <g filter="url(#shadow)">
    <!-- Main page body with folded corner cut -->
    <path d="M26 18 C26 13.58 29.58 10 34 10 H74 L94 30 V102 C94 106.42 90.42 110 86 110 H34 C29.58 110 26 106.42 26 102 Z" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    
    <!-- Folded Corner -->
    <path d="M74 10 V26 C74 28.2 75.8 30 78 30 H94 Z" fill="#334155"/>
  </g>

  <!-- Markdown 'M' Symbol -->
  <path d="M38 74 V46 L47 57 L56 46 V74" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Down Arrow (Markdown indicator) -->
  <path d="M68 48 V68 M62 62 L68 68 L74 62" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Document Lines (Representing exported docs) -->
